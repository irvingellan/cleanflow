name: Engineering checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, "codex/pkg2-*"]

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Integration scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Verify the event checkout and determine scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOSTING: ${{ contains(github.event.pull_request.labels.*.name, 'scope:hosting') }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'scope:full') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify HEAD)" == "$GITHUB_SHA" ]] ||
            { echo 'Checkout does not match the event SHA.'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] ||
              { echo 'Push verification requires main.'; exit 1; }
            {
              echo '## CleanFlow integration checkpoint'
              printf -- '- Main commit: `%s`\n- Scope: full\n' "$GITHUB_SHA"
              echo '- Scope verification: passed'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$(git show --no-patch --format=%P HEAD)" == "$BASE_SHA $HEAD_SHA" ]] ||
            { echo 'Checkout is not the event merge commit for the exact PR base and head.'; exit 1; }
          # A rerun retains the event commits. Refresh only the labels.
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --paginate --jq '.[].name | ascii_downcase')"
            HOSTING=false
            FULL=false
            if grep -Fxq 'scope:hosting' <<< "$labels"; then HOSTING=true; fi
            if grep -Fxq 'scope:full' <<< "$labels"; then FULL=true; fi
          fi
          if [[ "$HOSTING" == true && "$FULL" == true ]]; then
            echo 'Conflicting scope labels: remove scope:hosting or scope:full.'
            exit 1
          fi
          scope=full
          # Keep working with the policy on main while it still expects an ancestor.
          DIFF_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          export DIFF_BASE
          policy_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          if git cat-file -e "$policy_sha:scripts/engineering.mjs" 2>/dev/null &&
            git cat-file -e "$policy_sha:scripts/releaseHostingScope.mjs" 2>/dev/null; then
            trusted="$(mktemp -d)"
            trap 'rm -rf "$trusted"' EXIT
            git archive "$policy_sha" scripts/engineering.mjs scripts/releaseHostingScope.mjs | tar -x -C "$trusted"
            scope="$(node --input-type=module - "$trusted" <<'NODE'
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const { checkCandidate } = await import(pathToFileURL(join(process.argv[2], "scripts/engineering.mjs")));
          const { DIFF_BASE: base, HEAD_SHA: head, FULL } = process.env;
          const candidate = { base, head, scope: FULL === "true" ? "full" : "hosting" };
          try {
            console.log(checkCandidate(process.cwd(), candidate).scope);
          } catch (error) {
            // The trusted policy makes these two errors specific to Hosting eligibility.
            if (candidate.scope !== "hosting" || !(error.message.startsWith("Hosting scope blocked:")
              || error.message === "Engineering and release policy changes require scope:full.")) throw error;
            console.log(checkCandidate(process.cwd(), { ...candidate, scope: "full" }).scope);
          }
          NODE
            )"
          else
            [[ "$FULL" == true && "$HEAD_SHA" != "$DIFF_BASE" ]] ||
              { echo 'A base without scope policy requires a scope:full bootstrap PR.'; exit 1; }
          fi
          {
            echo '## CleanFlow integration checkpoint'
            printf -- '- PR head: `%s`\n- PR base: `%s`\n- Scope: %s\n' "$HEAD_SHA" "$BASE_SHA" "$scope"
            echo '- Scope verification: passed'
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit tests and build
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Verify release and integration tooling
        run: node --test scripts/engineering.test.mjs scripts/releaseHostingOnly.test.mjs scripts/releaseNotificationBUpdate.test.mjs
      - run: npm test
      - run: npm run build:emulators
  manager_security:
    name: Manager security rules
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - &firebase_version
        name: Read locked Firebase CLI version
        id: firebase_version
        run: node -p "'version=' + require('./package-lock.json').packages['node_modules/firebase-tools'].version" >> "$GITHUB_OUTPUT"
      # Keep the Firestore-only and Firestore + Storage archives separate.
      - &firebase_firestore_storage_cache
        name: Cache Firestore and Storage emulators
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-${{ steps.firebase_version.outputs.version }}-firestore-storage
      - run: npm run test:security
  hub_security:
    name: Cleaner Hub security rules
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - *firebase_version
      - &firebase_firestore_cache
        name: Cache Firestore emulator
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-${{ steps.firebase_version.outputs.version }}-firestore
      - run: npm run test:cleaner-hub:security
  security:
    name: Security rules
    needs: [manager_security, hub_security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both security suites to pass
        env:
          MANAGER_RESULT: ${{ needs.manager_security.result }}
          HUB_RESULT: ${{ needs.hub_security.result }}
        run: |
          if [[ "$MANAGER_RESULT" != success || "$HUB_RESULT" != success ]]; then
            printf 'Manager security rules: %s\nCleaner Hub security rules: %s\n' "$MANAGER_RESULT" "$HUB_RESULT"
            exit 1
          fi
  manager_e2e:
    name: Manager browser tests
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - *firebase_version
      - *firebase_firestore_cache
      - &playwright_version
        name: Read locked Playwright version
        id: playwright_version
        run: node -p "'version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version" >> "$GITHUB_OUTPUT"
      - &playwright_cache
        name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}-chromium-webkit
      - &playwright_install
        name: Install Playwright browsers and system dependencies
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium webkit
      - &playwright_install_deps
        name: Install Playwright system dependencies
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium webkit
      - run: npm run test:e2e
  hub_e2e:
    name: Cleaner Hub browser tests
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - *firebase_version
      - *firebase_firestore_storage_cache
      - *playwright_version
      - *playwright_cache
      - *playwright_install
      - *playwright_install_deps
      - run: npm run test:cleaner-hub:e2e
  suites:
    name: Image, Job Detail and PWA suites
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release tests inspect exact historical baselines.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - *playwright_version
      - *playwright_cache
      - *playwright_install
      - *playwright_install_deps
      - name: Verify image processing and pending-thumbnail regressions in Chromium and WebKit
        run: |
          npx --no-install playwright test --config=e2e/image-optimizer/playwright.config.js
          npx --no-install playwright test --config=e2e/checklist-gallery/playwright.config.js
      - name: Verify Job Detail intents and lifecycle harness suites
        run: |
          npx --no-install playwright test --config=playwright.job-intent.config.js
          npx --no-install playwright test --config=playwright.lifecycle.config.js
      - name: Verify built entry, missing assets and PWA recovery on private Hosting
        run: node e2e/pwa-entry/run.mjs
  verification:
    # Keeps the historical check name. It runs only when every parallel job passed.
    name: Unit, build and emulator checks
    needs: [scope, unit, manager_security, hub_security, security, manager_e2e, hub_e2e, suites]
    runs-on: ubuntu-latest
    steps:
      - name: Record technical checkpoint
        run: |
          printf '%s\n' '- Unit, build, security and browser checks: passed in CI with emulators' >> "$GITHUB_STEP_SUMMARY"
