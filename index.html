<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="CleanFlow operations platform foundation build"
    />
    <meta name="theme-color" content="#315c49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CleanFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CleanFlow</title>
  </head>
  <body>
    <main id="cleanflow-startup">
      <p data-startup-pending role="status">Opening CleanFlow…</p>
      <p data-startup-alert role="alert" hidden></p>
      <button data-startup-retry type="button" hidden></button>
      <noscript><style>[data-startup-pending] { display: none; }</style><p>Enable JavaScript to open CleanFlow.</p></noscript>
    </main>
    <div id="root" hidden></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
