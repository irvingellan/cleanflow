<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Minha agenda de serviços no CleanFlow" />
    <meta name="theme-color" content="#315c49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Minha agenda" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="/agenda" />
    <link rel="icon" href="/agenda-icon-192.png" type="image/png" />

    <link rel="manifest" href="/agenda.webmanifest" />
    <title>Minha agenda · CleanFlow</title>

  <body>
    <main id="cleanflow-startup">
      <p data-startup-pending role="status">Abrindo o CleanFlow…</p>
      <p data-startup-alert role="alert" hidden></p>
      <button data-startup-retry type="button" hidden></button>
      <noscript><style>[data-startup-pending] { display: none; }</style><p>Ative o JavaScript para abrir o CleanFlow.</p></noscript>
    </main>
    <div id="root" hidden></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
