<!doctype html><html lang="en"><meta charset="utf-8"><title>Local shadow pairing</title>
<h1>Shadow observer · local pairing only</h1><p>This does not capture platform credentials. Real DOM profiles remain unvalidated.</p>
<form><label>Loopback port <input id="port" type="number" min="1024" max="65535" required></label>
<label>Local pairing key <input id="key" type="password" required autocomplete="off"></label>
<label>Hospitable source ID <input id="hospitable" maxlength="80"></label>
<label>Guesty source ID <input id="guesty" maxlength="80"></label>
<button>Save local pairing</button></form><p id="status" role="status"></p><script src="options.js"></script></html>
